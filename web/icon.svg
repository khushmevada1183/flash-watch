<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular badge -->
  <circle cx="256" cy="256" r="248" fill="#121318"/>
  <circle cx="256" cy="256" r="246" stroke="#232733" stroke-width="4" fill="none"/>

  <!-- Top strap -->
  <path d="M190 20 L322 20 L310 130 L202 130 Z" fill="url(#strapGrad)"/>
  <rect x="210" y="45" width="92" height="10" rx="5" fill="#3a404f"/>
  <rect x="210" y="75" width="92" height="10" rx="5" fill="#3a404f"/>
  <rect x="210" y="105" width="92" height="10" rx="5" fill="#3a404f"/>

  <!-- Bottom strap -->
  <path d="M202 382 L310 382 L322 492 L190 492 Z" fill="url(#strapGrad)"/>
  <rect x="210" y="398" width="92" height="10" rx="5" fill="#3a404f"/>
  <rect x="210" y="428" width="92" height="10" rx="5" fill="#3a404f"/>
  <rect x="210" y="458" width="92" height="10" rx="5" fill="#3a404f"/>

  <!-- Watch body -->
  <rect x="136" y="116" width="240" height="280" rx="56" fill="url(#bodyGrad)" stroke="#303644" stroke-width="6"/>
  <!-- Crown button -->
  <path d="M376 226 L388 230 L388 282 L376 286 Z" fill="#474f63" stroke="#252a36" stroke-width="2"/>

  <!-- Screen bezel -->
  <rect x="156" y="136" width="200" height="240" rx="42" fill="#08090c" stroke="#1d212b" stroke-width="3"/>

  <!-- BLE Antenna / Lightning Flash Symbol -->
  <path d="M266 172 L224 246 L254 246 L244 308 L288 234 L258 234 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Radio signal arcs -->
  <path d="M304 220 A 42 42 0 0 1 304 260" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M324 205 A 64 64 0 0 1 324 275" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M208 220 A 42 42 0 0 0 208 260" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M188 205 A 64 64 0 0 0 188 275" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Text "FLASH" -->
  <text x="256" y="348" text-anchor="middle" fill="#8d99ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="4">FLASH</text>
</svg>
